<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Velaris Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/static/vendor/chart.umd.js"></script>
<script src="/static/vendor/react.development.js"></script>
<script src="/static/vendor/react-dom.development.js"></script>
<script src="/static/vendor/babel.min.js"></script>
<style>
  :root {
    --indigo: #6366F1;
    --indigo-2: #818CF8;
    --orange: #F97316;
    --green: #10B981;
    --red:    #EF4444;
    --yellow: #F59E0B;
  }
  html[data-theme="dark"] {
    --bg:        #0F1117;
    --bg-elev:   #14161F;
    --card:      #1A1D27;
    --card-2:    #1F2330;
    --border:    rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.12);
    --text:      #F1F5F9;
    --muted:     #94A3B8;
    --dim:       #64748B;
    --chip-bg:   rgba(255,255,255,0.04);
    --input-bg:  #0F1117;
    --shadow:    0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.35);
    --kpi-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 12px 30px rgba(0,0,0,0.4);
    --grid-line: rgba(255,255,255,0.06);
    --logo-mark: #6366F1;
    --scroll-thumb: rgba(255,255,255,0.12);
  }
  html[data-theme="light"] {
    --bg:        #F6F6F3;
    --bg-elev:   #FAFAF7;
    --card:      #FFFFFF;
    --card-2:    #F9F9F6;
    --border:    rgba(15,17,23,0.08);
    --border-strong: rgba(15,17,23,0.14);
    --text:      #0F1117;
    --muted:     #475569;
    --dim:       #64748B;
    --chip-bg:   rgba(15,17,23,0.035);
    --input-bg:  #FFFFFF;
    --shadow:    0 1px 0 rgba(255,255,255,0.6) inset, 0 1px 2px rgba(15,17,23,0.04), 0 8px 20px rgba(15,17,23,0.04);
    --kpi-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 1px 3px rgba(15,17,23,0.05), 0 10px 30px rgba(15,17,23,0.06);
    --grid-line: rgba(15,17,23,0.06);
    --logo-mark: #6366F1;
    --scroll-thumb: rgba(15,17,23,0.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }

  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; color: inherit; }

  /* ---------- App shell ---------- */
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 20px;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 8px; }
  .brand-mark {
    width: 28px; height: 28px;
    display: grid; place-items: center;
  }
  .brand-mark svg { width: 28px; height: 28px; }
  .brand-name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--muted); }

  .nav-section-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--dim); padding: 0 10px; margin-bottom: 6px; font-weight: 600;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    color: var(--muted); font-size: 13px; font-weight: 500;
    background: transparent; border: 0; text-align: left; width: 100%;
    transition: background 120ms, color 120ms;
  }
  .nav-item:hover { background: var(--chip-bg); color: var(--text); }
  .nav-item.active { background: color-mix(in oklab, var(--indigo) 14%, transparent); color: var(--text); }
  html[data-theme="light"] .nav-item.active { background: color-mix(in oklab, var(--indigo) 10%, transparent); }
  .nav-item .icon { width: 16px; height: 16px; flex: 0 0 16px; color: currentColor; opacity: 0.85; }
  .nav-item .count {
    margin-left: auto; font-size: 11px; font-weight: 600;
    background: var(--chip-bg); color: var(--muted);
    padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--border);
  }
  .nav-item.active .count { background: var(--indigo); color: white; border-color: transparent; }

  .side-group { display: flex; flex-direction: column; gap: 8px; }
  .side-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); padding: 0 2px; font-weight: 600; }

  .select {
    appearance: none; -webkit-appearance: none;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 28px 8px 10px;
    border-radius: 8px;
    font-size: 12.5px; font-weight: 500;
    width: 100%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1l4 4 4-4' stroke='%2394A3B8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center;
    color-scheme: dark;
  }
  .select option { background: #1a1d2e; color: #e2e8f0; }
  .select:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px color-mix(in oklab, var(--indigo) 20%, transparent); }

  .svc-list { display: flex; flex-direction: column; gap: 2px; max-height: 240px; overflow-y: auto; padding-right: 2px; }
  .svc-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
    font-size: 12.5px; color: var(--muted);
  }
  .svc-row:hover { background: var(--chip-bg); color: var(--text); }
  .svc-row input { accent-color: var(--indigo); width: 13px; height: 13px; }
  .svc-row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); margin-left: auto; }
  .svc-row.up .dot { background: var(--green); box-shadow: 0 0 0 3px color-mix(in oklab, var(--green) 20%, transparent); }
  .svc-row.warn .dot { background: var(--orange); box-shadow: 0 0 0 3px color-mix(in oklab, var(--orange) 20%, transparent); }
  .svc-row.down .dot { background: var(--red); box-shadow: 0 0 0 3px color-mix(in oklab, var(--red) 20%, transparent); }
  .svc-row.checked { color: var(--text); }

  .sidebar-footer { margin-top: auto; padding: 10px 8px 2px; border-top: 1px solid var(--border); }
  .sidebar-footer .user { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #F97316, #EF4444);
    display: grid; place-items: center; color: white; font-weight: 600; font-size: 11px;
  }
  .user-meta { display: flex; flex-direction: column; line-height: 1.15; }
  .user-meta strong { font-size: 12.5px; font-weight: 600; }
  .user-meta span { font-size: 11px; color: var(--muted); }

  /* ---------- Top bar ---------- */
  .main { min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    background: color-mix(in oklab, var(--bg) 85%, transparent);
    backdrop-filter: saturate(140%) blur(8px);
    -webkit-backdrop-filter: saturate(140%) blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .crumbs .sep { opacity: 0.5; }
  .page-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
  .topbar-spacer { flex: 1; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 10px 5px 8px; border-radius: 999px;
    background: color-mix(in oklab, var(--green) 12%, transparent);
    color: color-mix(in oklab, var(--green) 85%, var(--text));
    border: 1px solid color-mix(in oklab, var(--green) 30%, transparent);
    font-size: 11.5px; font-weight: 500;
  }
  .status-pill .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 color-mix(in oklab, var(--green) 60%, transparent);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--green) 60%, transparent); }
    70% { box-shadow: 0 0 0 6px color-mix(in oklab, var(--green) 0%, transparent); }
    100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--green) 0%, transparent); }
  }

  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted);
    display: grid; place-items: center;
    transition: background 120ms, color 120ms, border-color 120ms;
  }
  .icon-btn:hover { background: var(--chip-bg); color: var(--text); border-color: var(--border-strong); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
    background: var(--chip-bg); color: var(--text);
    border: 1px solid var(--border);
    transition: background 120ms, border-color 120ms;
  }
  .btn:hover { background: var(--card-2); border-color: var(--border-strong); }
  .btn-primary {
    background: var(--indigo); color: white; border-color: transparent;
    box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 4px 14px color-mix(in oklab, var(--indigo) 35%, transparent);
  }
  .btn-primary:hover { background: color-mix(in oklab, var(--indigo) 92%, white 8%); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--text); background: var(--chip-bg); }

  /* ---------- Page container ---------- */
  .page { padding: 24px 28px 48px; max-width: 1440px; margin: 0 auto; }
  .page-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .page-header h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .page-header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .section-title {
    display: flex; align-items: center; gap: 10px;
    margin: 22px 0 12px;
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* ---------- KPI cards ---------- */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 16px 14px;
    box-shadow: var(--kpi-shadow);
    position: relative; overflow: hidden;
    transition: transform 160ms cubic-bezier(.2,.8,.2,1), border-color 160ms;
  }
  .kpi:hover { transform: translateY(-2px); border-color: var(--border-strong); }
  .kpi::before {
    content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent, var(--indigo)), transparent);
    opacity: 0.45;
  }
  .kpi-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 500; }
  .kpi-label .iico { width: 14px; height: 14px; color: var(--accent, var(--indigo)); }
  .kpi-value { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  .kpi-meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .kpi-delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; font-size: 11.5px; }
  .kpi-delta.up { color: var(--red); }
  .kpi-delta.down { color: var(--green); }
  .kpi-delta.flat { color: var(--muted); }
  .kpi-spark { position: absolute; right: 10px; bottom: 8px; width: 80px; height: 28px; opacity: 0.9; }

  /* ---------- Chart cards ---------- */
  .chart-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .chart-full { margin-top: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .chart-card { padding: 16px 16px 14px; }
  .chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
  .chart-head h3 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; }
  .chart-head p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .chart-legend { display: flex; gap: 12px; flex-wrap: wrap; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
  .chart-body { position: relative; height: 220px; }
  .chart-body.sm { height: 170px; }
  .chart-body.lg { height: 260px; }

  /* ---------- Filter bar ---------- */
  .filter-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 16px;
  }
  .seg { display: inline-flex; background: var(--chip-bg); border-radius: 8px; padding: 3px; border: 1px solid var(--border); gap: 2px; }
  .seg button {
    background: transparent; border: 0; padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 500; color: var(--muted);
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 1px 2px rgba(0,0,0,0.25); }
  html[data-theme="light"] .seg button.on { box-shadow: 0 1px 2px rgba(15,17,23,0.06); }
  .seg button .n { margin-left: 6px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .seg button.on .n { color: var(--muted); }

  .search-box {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 8px;
    background: var(--chip-bg); border: 1px solid var(--border);
    min-width: 240px;
  }
  .search-box input { background: transparent; border: 0; outline: 0; color: var(--text); font-size: 12.5px; width: 100%; }
  .search-box input::placeholder { color: var(--dim); }
  .search-box svg { width: 14px; height: 14px; color: var(--dim); }
  .filter-spacer { flex: 1; }

  /* ---------- Incident cards ---------- */
  .incident-list { display: flex; flex-direction: column; gap: 10px; }
  .incident {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    position: relative; overflow: hidden;
    transition: border-color 160ms, transform 160ms;
  }
  .incident::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent, var(--indigo));
  }
  .incident:hover { border-color: var(--border-strong); }
  .incident-head { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px 14px 18px; cursor: pointer; }
  .incident-main { flex: 1; min-width: 0; }
  .inc-row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .inc-service { font-weight: 600; font-size: 14px; letter-spacing: -0.005em; }
  .inc-diag { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .inc-meta { display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 11.5px; margin-top: 6px; }
  .inc-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chev { color: var(--dim); transition: transform 200ms; }
  .incident.open .chev { transform: rotate(180deg); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 500; line-height: 1.3;
    border: 1px solid transparent;
  }
  .pill .pdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.indigo { background: color-mix(in oklab, var(--indigo) 14%, transparent); color: var(--indigo-2); border-color: color-mix(in oklab, var(--indigo) 25%, transparent); }
  html[data-theme="light"] .pill.indigo { color: #4F46E5; }
  .pill.orange { background: color-mix(in oklab, var(--orange) 14%, transparent); color: #FB923C; border-color: color-mix(in oklab, var(--orange) 30%, transparent); }
  html[data-theme="light"] .pill.orange { color: #C2410C; }
  .pill.red { background: color-mix(in oklab, var(--red) 14%, transparent); color: #F87171; border-color: color-mix(in oklab, var(--red) 30%, transparent); }
  html[data-theme="light"] .pill.red { color: #B91C1C; }
  .pill.green { background: color-mix(in oklab, var(--green) 14%, transparent); color: #34D399; border-color: color-mix(in oklab, var(--green) 28%, transparent); }
  html[data-theme="light"] .pill.green { color: #047857; }
  .pill.gray { background: var(--chip-bg); color: var(--muted); border-color: var(--border); }

  .incident-body {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 260ms cubic-bezier(.2,.8,.2,1);
  }
  .incident.open .incident-body { grid-template-rows: 1fr; }
  .incident-body > .inner { overflow: hidden; min-height: 0; }
  .inc-content {
    padding: 4px 16px 16px 18px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
    display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px;
  }

  .metric-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 14px; }
  .metric-pill {
    padding: 10px 12px; border-radius: 10px;
    background: var(--chip-bg); border: 1px solid var(--border);
  }
  .metric-pill .ml { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .metric-pill .mv { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; letter-spacing: -0.01em; }
  .metric-pill .ms { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .metric-pill.hot { border-color: color-mix(in oklab, var(--red) 30%, transparent); background: color-mix(in oklab, var(--red) 8%, var(--chip-bg)); }
  .metric-pill.warn { border-color: color-mix(in oklab, var(--orange) 30%, transparent); background: color-mix(in oklab, var(--orange) 8%, var(--chip-bg)); }

  .subhead { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 14px 0 8px; }
  .playbook {
    padding: 12px 14px; border-radius: 10px;
    background: color-mix(in oklab, var(--indigo) 8%, var(--chip-bg));
    border: 1px solid color-mix(in oklab, var(--indigo) 22%, var(--border));
    font-size: 13px; color: var(--text); line-height: 1.55;
  }
  .playbook ol { margin: 6px 0 0; padding-left: 20px; }
  .playbook li { margin-bottom: 4px; color: var(--muted); }
  .playbook li strong { color: var(--text); font-weight: 500; }

  .log-sample {
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 11.5px; line-height: 1.55; color: var(--muted);
    max-height: 170px; overflow: auto;
  }
  .log-line { display: flex; gap: 10px; padding: 2px 0; border-bottom: 1px dashed var(--border); }
  .log-line:last-child { border-bottom: 0; }
  .log-ts { color: var(--dim); white-space: nowrap; }
  .log-lvl { width: 44px; font-weight: 600; }
  .log-lvl.err { color: var(--red); }
  .log-lvl.warn { color: var(--orange); }
  .log-msg { color: var(--text); opacity: 0.85; }

  .status-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .status-row .select { width: auto; min-width: 180px; }

  /* ---------- Rule cards ---------- */
  .rule {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 160ms;
  }
  .rule:hover { border-color: var(--border-strong); }
  .rule-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
  .rule-name { font-weight: 600; font-size: 14px; }
  .rule-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .rule-body {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 260ms cubic-bezier(.2,.8,.2,1);
  }
  .rule.open .rule-body { grid-template-rows: 1fr; }
  .rule-body > .inner { overflow: hidden; min-height: 0; }
  .rule-form { padding: 6px 16px 18px; border-top: 1px solid var(--border); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin-top: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .input, .textarea {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px;
    font-size: 13px; color: var(--text); outline: none;
    font-family: inherit;
  }
  .textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px color-mix(in oklab, var(--indigo) 18%, transparent); }
  .checks { display: flex; gap: 16px; padding: 6px 0; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
  .check input { accent-color: var(--indigo); width: 14px; height: 14px; }
  .triple { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }

  .add-rule {
    border: 1px dashed var(--border-strong);
    background: color-mix(in oklab, var(--indigo) 4%, transparent);
    border-radius: 12px; padding: 22px; margin-top: 10px;
    text-align: center; color: var(--muted); font-size: 13px;
  }
  .add-rule .inline { display: inline-flex; align-items: center; gap: 8px; }

  /* ---------- Tweaks panel ---------- */
  .tweaks {
    position: fixed; right: 18px; bottom: 18px; width: 260px; z-index: 50;
    background: var(--card); border: 1px solid var(--border-strong); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    font-size: 13px;
  }
  .tweaks-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .tweaks-head strong { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .tweaks-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  .tweak-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tweak-row label { font-size: 12.5px; color: var(--text); }
  .switch-row { display: inline-flex; gap: 4px; background: var(--chip-bg); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
  .switch-row button { background: transparent; border: 0; padding: 4px 10px; border-radius: 6px; font-size: 11.5px; color: var(--muted); }
  .switch-row button.on { background: var(--card-2); color: var(--text); }

  /* misc */
  .hr { height: 1px; background: var(--border); margin: 14px 0; }
  .kbd {
    display: inline-block; padding: 1px 6px; border-radius: 4px;
    background: var(--chip-bg); border: 1px solid var(--border); border-bottom-width: 2px;
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted);
  }

  /* ---------- Alert channels ---------- */
  .btn-danger { background: transparent; border-color: color-mix(in oklab, var(--red) 30%, transparent); color: color-mix(in oklab, var(--red) 80%, var(--text)); }
  .btn-danger:hover { background: color-mix(in oklab, var(--red) 10%, transparent); }

  .channel-list { display: flex; flex-direction: column; gap: 10px; }
  .channel {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; display: flex; align-items: center; gap: 14px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
    transition: border-color 160ms;
  }
  .channel:hover { border-color: var(--border-strong); }
  .channel::before {
    content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent, var(--indigo)), transparent);
    opacity: 0.4;
  }
  .ch-logo {
    width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    flex: 0 0 40px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.2);

  .ch-logo svg { width: 22px; height: 22px; }
  .ch-main { flex: 1; min-width: 0; }
  .ch-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .ch-name { font-weight: 600; font-size: 14px; letter-spacing: -0.005em; }
  .ch-target { color: var(--muted); font-size: 12.5px; }
  .ch-meta { display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 11.5px; flex-wrap: wrap; }
  .ch-meta .sep { opacity: 0.5; }
  .ch-meta strong { color: var(--muted); font-weight: 500; }
  .ch-actions { display: flex; gap: 6px; align-items: center; }

  .add-card { padding: 18px 18px 16px; }
  .add-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .add-head h3 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
  .add-head p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  .type-tabs {
    display: inline-flex; gap: 4px; padding: 4px;
    background: var(--chip-bg); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 18px;
  }
  .type-tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 7px; background: transparent; border: 0;

  }
  .type-tab:hover { color: var(--text); }
  .type-tab.on {
    background: var(--card); color: var(--text);

  html[data-theme="light"] .type-tab.on { box-shadow: 0 1px 2px rgba(15,17,23,0.06); }

  .field .hint { font-size: 11.5px; color: var(--dim); margin-top: 2px; }

  .sev-checks { display: flex; gap: 8px; flex-wrap: wrap; }

    display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px;

    transition: border-color 120ms, background 120ms; user-select: none;

  .sev-check input { display: none; }
  .sev-check .box {

    display: flex; align-items: center; gap: 8px;
    margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);

  .test-result {
    font-size: 12px; color: var(--green); display: inline-flex; align-items: center; gap: 6px;

    background: color-mix(in oklab, var(--green) 12%, transparent);
    border: 1px solid color-mix(in oklab, var(--green) 28%, transparent);

          <path d="M18.96 8.14a2.06 2.06 0 1 1 2.06 2.06h-2.06V8.14zm-1.04 0a2.06 2.06 0 1 1-4.12 0V2.98a2.06 2.06 0 1 1 4.12 0v5.16z" fill="#2EB67D"/>
          <path d="M15.86 18.96a2.06 2.06 0 1 1-2.06 2.06v-2.06h2.06zm0-1.04a2.06 2.06 0 1 1 0-4.12h5.16a2.06 2.06 0 1 1 0 4.12h-5.16z" fill="#ECB22E"/>

    // ------------------------------ Data ------------------------------
    let SERVICES = [];

    let INCIDENTS = [];

    let RULES = [];

    // ------------------------------ Tweaks (edit-mode) ------------------------------
    function useTweaks() {
      const [tweaks, setTweaks] = useState(TWEAKS);
      const [editMode, setEditMode] = useState(false);

      useEffect(() => {
        const onMessage = (e) => {
          if (!e.data) return;
          if (e.data.type === '__activate_edit_mode') setEditMode(true);
          if (e.data.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', onMessage);
        try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
        return () => window.removeEventListener('message', onMessage);
      }, []);

      const set = (key, value) => {
        setTweaks(prev => {
          const next = { ...prev, [key]: value };
          try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: value } }, '*'); } catch {}
          return next;
        });
      };
      return { tweaks, set, editMode };
    }

    // ------------------------------ Charts ------------------------------
    function useChart(ref, buildConfig, deps) {
      const chartRef = useRef(null);
      useEffect(() => {
        if (!ref.current) return;
        const ctx = ref.current.getContext('2d');
        chartRef.current = new Chart(ctx, buildConfig());
        return () => { chartRef.current && chartRef.current.destroy(); };
      }, deps);
    }

    function themedAxisColors() {
      const s = getComputedStyle(document.documentElement);
      return {
        text: s.getPropertyValue('--muted').trim() || '#94A3B8',
        grid: s.getPropertyValue('--grid-line').trim() || 'rgba(255,255,255,0.06)',
        border: 'transparent',
      };
    }

    function axisCfg(opts = {}) {
      const c = themedAxisColors();
      return {
        x: {
          grid: { display: false, drawBorder: false, color: c.border },
          border: { display: false },
          ticks: { color: c.text, font: { size: 11, family: 'Inter' }, maxRotation: 0 },
          ...opts.x
        },
        y: {
          grid: { color: c.grid, drawBorder: false },
          border: { display: false },
          ticks: { color: c.text, font: { size: 11, family: 'Inter' }, padding: 6 },
          ...opts.y
        }
      };
    }

    function baseOpts() {
      return {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(15,17,23,0.96)',
            borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1,
            titleColor: '#F1F5F9', bodyColor: '#CBD5E1', padding: 10, cornerRadius: 8,
            titleFont: { family: 'Inter', weight: '600', size: 12 },
            bodyFont: { family: 'JetBrains Mono', size: 11 },
            boxPadding: 4,
          }
        }
      };
    }

    function buildTimeLabels(n, stepMin=5, startHoursAgo=2) {
      const out = [];
      const now = new Date();
      now.setMinutes(Math.floor(now.getMinutes()/stepMin)*stepMin, 0, 0);
      for (let i = n-1; i >= 0; i--) {
        const d = new Date(now.getTime() - i*stepMin*60_000);
        const hh = String(d.getHours()).padStart(2,'0');
        const mm = String(d.getMinutes()).padStart(2,'0');
        out.push(`${hh}:${mm}`);
      }
      return out;
    }

    // Seeded noise for reproducibility
    function seeded(seed) { let s = seed; return () => (s = (s*9301+49297) % 233280) / 233280; }

    function genSeries({len=48, base=1, amp=0.3, spikeAt=null, spikeMag=2, rng}) {
      const arr = [];
      for (let i = 0; i < len; i++) {
        const t = i/len;
        let v = base + Math.sin(t*Math.PI*2 + 1.1)*amp*0.35 + Math.sin(t*Math.PI*6 + 0.3)*amp*0.2 + (rng()-0.5)*amp*0.4;
        if (spikeAt != null && i >= spikeAt && i <= spikeAt+3) {
          v += spikeMag * Math.max(0, 1 - (i-spikeAt)/3);
        }
        arr.push(Math.max(0, v));
      }
      return arr;
    }

      useEffect(() => {
        if (!ref.current || !data) return;

    function MiniChart({ seed, color, unit='', type='line', yMax=null, thresh=null }) {
      const ref = useRef(null);
      const labels = useMemo(()=> buildTimeLabels(36, 5), []);
      useChart(ref, () => {
        const rng = seeded(seed);
        const data = genSeries({ len:36, base: color==='var' ? 45 : 50, amp: 18, rng });
        const mkGrad = (ctx, col) => {
          const g = ctx.createLinearGradient(0, 0, 0, 170);
          g.addColorStop(0, col + '55'); g.addColorStop(1, col + '00'); return g;
        };
        const ds = type === 'bar'
          ? { label: '', data, backgroundColor: color, borderRadius: 2, barPercentage: 0.9 }
          : { label: '', data, borderColor: color, backgroundColor: ctx => mkGrad(ctx.chart.ctx, color), borderWidth: 1.6, fill: true, tension: 0.35, pointRadius: 0, pointHoverRadius: 4 };
        const yTicks = { callback: v => v + unit, color: themedAxisColors().text, font:{size:10,family:'Inter'}, padding:4 };
        const cfg = {
          type: type === 'bar' ? 'bar' : 'line',
          data: { labels, datasets: [ds] },
          options: {
            ...baseOpts(),
            scales: axisCfg({
              x: { ticks: { ...axisCfg().x.ticks, font:{size:10,family:'Inter'}, maxTicksLimit: 5 } },
              y: { ticks: yTicks, suggestedMax: yMax || undefined, beginAtZero: true }
            }),

        if (thresh != null) {

      }, []);
      return <canvas ref={ref}/>;
    }

    function Sparkline({ seed, color, width=80, height=28 }) {
      const ref = useRef(null);
      useEffect(() => {
        const c = ref.current; if (!c) return;
        const ctx = c.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        c.width = width*dpr; c.height = height*dpr; ctx.scale(dpr, dpr);
        const rng = seeded(seed);
        const pts = Array.from({length: 24}, (_,i) => 0.5 + Math.sin(i/3 + seed) * 0.18 + (rng()-0.5)*0.25);
        const max = Math.max(...pts), min = Math.min(...pts);
        const norm = pts.map(v => (v-min)/(max-min+0.001));
        ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.lineCap='round';
        ctx.beginPath();
        norm.forEach((v,i) => {
          const x = (i/(norm.length-1))*(width-2)+1;
          const y = height - (v*(height-4) + 2);
          if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
        // area
        ctx.lineTo(width-1, height); ctx.lineTo(1, height); ctx.closePath();
        const g = ctx.createLinearGradient(0,0,0,height);
        g.addColorStop(0, color+'55'); g.addColorStop(1, color+'00');
        ctx.fillStyle = g; ctx.fill();
      }, []);
      return <canvas ref={ref} style={{ width, height }} />;
    }

    function IncidentsPage({ incidents: INCIDENTS, onStatusChange }) {
      const [filter, setFilter] = useState('open');
      const [query, setQuery] = useState('');
      const [openId, setOpenId] = useState(null);
      const localStatus = {};

      const filtered = INCIDENTS.filter(i => {
        const status = i.status;
        if (filter !== 'all' && filter !== status) return false;
        if (query && !(i.service.includes(query) || i.diagnosis.toLowerCase().includes(query.toLowerCase()))) return false;
        return true;
      });
      const counts = {
        all: INCIDENTS.length,
        open: INCIDENTS.filter(i => (localStatus[i.id] || i.status) === 'open').length,
        acknowledged: INCIDENTS.filter(i => (localStatus[i.id] || i.status) === 'acknowledged').length,
        resolved: INCIDENTS.filter(i => (localStatus[i.id] || i.status) === 'resolved').length,
      };
      return (
        <div>
          <div className="page-header">
            <div>
              <h1>Incidents</h1>
              <p>{counts.open} open · {counts.acknowledged} acknowledged · {counts.resolved} resolved in last 24h</p>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="btn">Export CSV</button>
              <button className="btn btn-primary"><Ico.plus/> Trigger test incident</button>
            </div>
          </div>

          <div className="filter-bar">
            <div className="seg">
              {['all','open','acknowledged','resolved'].map(f => (
                <button key={f} className={filter===f ? 'on' : ''} onClick={()=>setFilter(f)}>
                  {f}<span className="n mono">{counts[f]}</span>
                </button>
              ))}
            </div>
            <div className="search-box">
              <Ico.search/>
              <input placeholder="Search incidents by service or keyword…" value={query} onChange={e=>setQuery(e.target.value)} />
            </div>
            <div className="filter-spacer"/>
            <button className="btn btn-ghost">Sort: newest</button>
          </div>

          <div className="incident-list">
            {filtered.map(inc => (
              <IncidentCard
                key={inc.id}
                inc={inc}
                open={openId === inc.id}
                onToggle={() => setOpenId(openId === inc.id ? null : inc.id)}
                onChangeStatus={(s)=>{ onStatusChange && onStatusChange(inc.db_id, s); }}
              />
            ))}
            {filtered.length === 0 && (
              <div className="add-rule">No incidents match this filter.</div>
            )}
          </div>
        </div>
      );
    }

    function RulesPage({ rules, setRules }) {
      const [openId, setOpenId] = useState(null);
      const saveRule = (draft) => {
        const isNew = String(draft.id).startsWith('new');
        const method = isNew ? 'POST' : 'PUT';
        const url = isNew ? `${API}/api/rules` : `${API}/api/rules/${draft.id}`;
        fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(draft)})
          .then(r=>r.json()).then(saved=>{
            setRules(prev => isNew ? [...prev,saved] : prev.map(r=>r.id===saved.id?saved:r));
          }).catch(()=>{});
        setOpenId(null);
      };
      const deleteRule = (id) => {
        fetch(`${API}/api/rules/${id}`,{method:'DELETE'}).catch(()=>{});
        setRules(prev=>prev.filter(r=>r.id!==id));
        setOpenId(null);
      };
      return (
        <div>
          <div className="page-header">
            <div>
              <h1>Detection rules</h1>
              <p>{rules.filter(r=>r.enabled).length} active · {rules.length} total</p>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="btn">Import from YAML</button>
            </div>
          </div>
          <div className="incident-list">
            {rules.map(rule => (
              <RuleCard
                key={rule.id} rule={rule}
                open={openId === rule.id}
                onToggle={() => setOpenId(openId === rule.id ? null : rule.id)}
                onSave={saveRule}
                onDelete={()=>deleteRule(rule.id)}
              />
            ))}
          </div>
          <NewRuleForm onAdd={saveRule}/>
        </div>
      );
    }

    function AddChannelForm({ availableRules, onSave, onCancel }) {
      const defaultName = { slack: 'Slack – incidents-critical', discord: 'Discord – SRE alerts', webhook: 'Internal Webhook' };
      const [type, setType] = useState('slack');
      const [name, setName] = useState(defaultName.slack);
      const [slackUrl, setSlackUrl] = useState('');
      const [slackChannel, setSlackChannel] = useState('incidents-critical');
      const [slackMention, setSlackMention] = useState('@sre-oncall');
      const [discordUrl, setDiscordUrl] = useState('');
      const [discordMention, setDiscordMention] = useState('@sre-oncall');
      const [discordUsername, setDiscordUsername] = useState('Velaris');
      const [hookUrl, setHookUrl] = useState('');
      const [hookSecret, setHookSecret] = useState('');
      const [hookMethod, setHookMethod] = useState('POST');
      const [hookHeaders, setHookHeaders] = useState('');
      const [sev, setSev] = useState({ critical:true, high:true, medium:false, any:false });
      const [allRulesToggle, setAllRulesToggle] = useState(true);
      const [pickedRules, setPickedRules] = useState({});
      const [testLoading, setTestLoading] = useState(false);
      const [testResult, setTestResult] = useState(null);
      const [saving, setSaving] = useState(false);

      const tabs = [
        { id:'slack',   label:'Slack',   logo:<Logos.slack/> },
        { id:'discord', label:'Discord', logo:<Logos.discord/> },
        { id:'webhook', label:'Webhook', logo:<Logos.webhook/> },
      ];

      const buildBody = () => {
        let config = {};
        if (type === 'slack')   config = { webhook_url: slackUrl, channel: slackChannel, mention: slackMention };
        if (type === 'discord') config = { webhook_url: discordUrl, mention: discordMention, username: discordUsername };
        if (type === 'webhook') config = { url: hookUrl, method: hookMethod, secret: hookSecret, headers: hookHeaders };
        const sevList = Object.entries(sev).filter(([k,v]) => v && k !== 'any').map(([k]) => k);
        if (sev.any) sevList.push('any');
        return {
          type, name, config,
          severities: sevList,
          all_rules: allRulesToggle,
          rule_ids: Object.entries(pickedRules).filter(([,v]) => v).map(([k]) => parseInt(k)),
        };
      };

      const resetForm = () => {
        setType('slack'); setName(defaultName.slack);
        setSlackUrl(''); setSlackChannel('incidents-critical'); setSlackMention('@sre-oncall');
        setDiscordUrl(''); setDiscordMention('@sre-oncall'); setDiscordUsername('Velaris');
        setHookUrl(''); setHookSecret(''); setHookMethod('POST'); setHookHeaders('');
        setSev({ critical:true, high:true, medium:false, any:false });
        setAllRulesToggle(true); setPickedRules({});
        setTestResult(null);
      };

      const handleTest = () => {
        setTestLoading(true);
        setTestResult(null);
        fetch(`${API}/api/channels/test`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(buildBody()),
        }).then(r => r.json()).then(data => {
          setTestResult(data);
          setTestLoading(false);
          if (data.ok) setTimeout(() => setTestResult(null), 5000);
        }).catch(err => {
          setTestResult({ ok: false, message: String(err) });
          setTestLoading(false);
        });
      };

      const handleSave = () => {
        setSaving(true);
        fetch(`${API}/api/channels`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(buildBody()),
        }).then(r => r.json()).then(ch => {
          setSaving(false);
          onSave && onSave(ch);
          resetForm();
        }).catch(() => setSaving(false));
      };

      return (
        <div className="card add-card">
          <div className="add-head">
            <div>
              <h3>Add a new channel</h3>
              <p>Send detected incidents to a destination of your choice.</p>
            </div>
          </div>

          <div className="type-tabs">
            {tabs.map(t => (
              <button key={t.id} className={`type-tab ${type===t.id ? 'on':''}`}
                onClick={()=>{ setType(t.id); setName(defaultName[t.id]); setTestResult(null); }}>
                {t.logo} {t.label}
              </button>
            ))}
          </div>

          <div className="form-grid">
            <div className="field full">
              <label>Channel name</label>
              <input className="input" value={name} onChange={e=>setName(e.target.value)} placeholder="Friendly label, e.g. SRE on-call Slack"/>
            </div>

            {type === 'slack' && <>
              <div className="field full">
                <label>Incoming webhook URL</label>
                <input className="input mono" value={slackUrl} onChange={e=>setSlackUrl(e.target.value)} placeholder="https://hooks.slack.com/services/…"/>
                <span className="hint">Create one in Slack → Apps → Incoming Webhooks.</span>
              </div>
              <div className="field">
                <label>Channel name</label>
                <div className="input-wrap">
                  <span className="input-prefix">#</span>
                  <input className="input mono with-prefix" value={slackChannel} onChange={e=>setSlackChannel(e.target.value.replace(/^#/,''))}/>
                </div>
              </div>
              <div className="field">
                <label>Mention on critical</label>
                <input className="input mono" value={slackMention} onChange={e=>setSlackMention(e.target.value)} placeholder="@user or @group"/>
              </div>
            </>}

            {type === 'discord' && <>
              <div className="field full">
                <label>Webhook URL</label>
                <input className="input mono" value={discordUrl} onChange={e=>setDiscordUrl(e.target.value)} placeholder="https://discord.com/api/webhooks/…"/>
                <span className="hint">Server Settings → Integrations → Webhooks → New Webhook.</span>
              </div>
              <div className="field">
                <label>Mention on critical</label>
                <input className="input mono" value={discordMention} onChange={e=>setDiscordMention(e.target.value)}/>
              </div>
              <div className="field">
                <label>Username override</label>
                <input className="input" value={discordUsername} onChange={e=>setDiscordUsername(e.target.value)}/>
              </div>
            </>}

            {type === 'webhook' && <>
              <div className="field">
                <label>HTTP method</label>
                <select className="select" value={hookMethod} onChange={e=>setHookMethod(e.target.value)}>
                  <option>POST</option><option>PUT</option><option>PATCH</option>
                </select>
              </div>
              <div className="field">
                <label>URL</label>
                <input className="input mono" value={hookUrl} onChange={e=>setHookUrl(e.target.value)} placeholder="https://…"/>
              </div>
              <div className="field full">
                <label>Signing secret</label>
                <input className="input mono" value={hookSecret} onChange={e=>setHookSecret(e.target.value)} placeholder="whsec_…"/>
                <span className="hint">Used to compute HMAC-SHA256 in the <span className="mono">X-Velaris-Signature</span> header.</span>
              </div>
              <div className="field full">
                <label>Custom headers (one per line, key: value)</label>
                <textarea className="textarea mono" value={hookHeaders} onChange={e=>setHookHeaders(e.target.value)} placeholder={"Authorization: Bearer <token>\nX-Source: velaris"}/>
              </div>
            </>}

            <div className="field full">
              <label>Trigger on severity</label>
              <div className="sev-checks">
                <SevCheck label="critical"     dotClass="crit" on={sev.critical} onChange={v=>setSev({...sev,critical:v})}/>
                <SevCheck label="high"         dotClass="high" on={sev.high}     onChange={v=>setSev({...sev,high:v})}/>
                <SevCheck label="medium"       dotClass="med"  on={sev.medium}   onChange={v=>setSev({...sev,medium:v})}/>
                <SevCheck label="any severity" dotClass="any"  on={sev.any}      onChange={v=>setSev({...sev,any:v})}/>
              </div>
            </div>

            <div className="field full">
              <label>Trigger on rules</label>
              <div className="sev-checks" style={{ marginBottom: 8 }}>
                <SevCheck label="All rules" dotClass="any" on={allRulesToggle} onChange={setAllRulesToggle}/>
              </div>
              {!allRulesToggle && availableRules.length > 0 && (
                <div className="rule-multi">
                  {availableRules.map(r => (
                    <label key={r.id} className={`row ${pickedRules[r.id] ? 'on':''}`}>
                      <input type="checkbox" checked={!!pickedRules[r.id]}
                        onChange={e=>setPickedRules({...pickedRules,[r.id]:e.target.checked})}/>
                      {r.name}
                    </label>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="ch-form-actions">
            <button className="btn" onClick={handleTest} disabled={testLoading}>
              <Ico.send style={{ width:13,height:13 }}/> {testLoading ? 'Sending…' : 'Send test alert'}
            </button>
            {testResult && (
              <span className="test-result" style={{ color: testResult.ok ? 'var(--green)' : 'var(--red)' }}>
                {testResult.ok
                  ? <Ico.check style={{ width:11,height:11 }}/>
                  : <span style={{ fontWeight:700 }}>✕</span>
                } {testResult.message}
              </span>
            )}
            <div style={{ flex:1 }}/>
            <button className="btn btn-ghost" onClick={() => { resetForm(); onCancel && onCancel(); }}>Cancel</button>
            <button className="btn btn-primary" onClick={handleSave} disabled={saving}>
              <Ico.plus/> {saving ? 'Saving…' : 'Save channel'}
            </button>
          </div>
        </div>
      );
    }

    function AlertChannelsPage({ channels, setChannels, theme, rules }) {
      const active = channels.filter(c=>c.active).length;

      const handleToggle = (ch) => {
        fetch(`${API}/api/channels/${ch.db_id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ active: !ch.active }),
        }).then(r => r.json()).then(updated => {
          setChannels(cs => cs.map(c => c.db_id === ch.db_id ? updated : c));
        }).catch(() => {});
      };

      const handleDelete = (ch) => {
        fetch(`${API}/api/channels/${ch.db_id}`, { method: 'DELETE' })
          .then(() => setChannels(cs => cs.filter(c => c.db_id !== ch.db_id)))
          .catch(() => {});
      };

      const handleSave = (newCh) => {
        setChannels(cs => [...cs, newCh]);
      };

      return (
        <div>
          <div className="page-header">
            <div>
              <h1>Alert channels</h1>
              <p>Where Velaris sends incident notifications. {active} of {channels.length} channels active.</p>
            </div>
          </div>
          <div className="section-title">Configured channels</div>
          <div className="channel-list">
            {channels.map(ch => (
              <ChannelCard key={ch.db_id} ch={ch} theme={theme}
                onToggle={() => handleToggle(ch)}
                onDelete={() => handleDelete(ch)}/>
            ))}
          </div>
          <div className="section-title">Add channel</div>
          <AddChannelForm availableRules={rules} onSave={handleSave} onCancel={() => {}}/>
        </div>
      );
    }

    // ------------------------------ Tweaks Panel ------------------------------
    function TweaksPanel({ tweaks, set, visible, theme, setTheme, accent, setAccent }) {
      if (!visible) return null;
      return (
        <div className="tweaks">
          <div className="tweaks-head">
            <strong>Tweaks</strong>
            <Ico.cog style={{ width: 14, height: 14, color: 'var(--muted)' }}/>
          </div>
          <div className="tweaks-body">
            <div className="tweak-row">
              <label>Theme</label>
              <div className="switch-row">
                <button className={theme==='dark' ? 'on' : ''} onClick={()=>setTheme('dark')}>Dark</button>
                <button className={theme==='light' ? 'on' : ''} onClick={()=>setTheme('light')}>Light</button>
              </div>
            </div>
            <div className="tweak-row">
              <label>Accent</label>
              <div className="switch-row">
                {Object.keys(ACCENTS).map(k => (
                  <button key={k} className={accent===k ? 'on' : ''} onClick={()=>setAccent(k)}>
                    <span style={{ display: 'inline-block', width: 10, height: 10, borderRadius: 3, background: ACCENTS[k].main, verticalAlign: 'middle', marginRight: 5 }}/>
                    {k}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ------------------------------ App ------------------------------
    function App() {
      const { tweaks, set, editMode } = useTweaks();
      const [theme, setThemeState] = useState(tweaks.theme || 'dark');
      const [accent, setAccentState] = useState(tweaks.accent || 'indigo');
      const [route, setRoute] = useState(() => localStorage.getItem('va.route') || 'overview');
      const [timeRange, setTimeRange] = useState('7d');
      const [incidents,  setIncidents]  = useState([]);
      const [allRules,   setAllRules]   = useState([]);
      const [apiKpis,    setApiKpis]    = useState(null);
      const [ozOnline,   setOzOnline]   = useState(false);
      const [channels,   setChannels]   = useState([]);

      useEffect(() => {
        fetch(`${API}/api/incidents?range=${timeRange}`).then(r=>r.json()).then(d=>{ INCIDENTS=d; setIncidents(d); }).catch(()=>{});
        fetch(`${API}/api/rules`).then(r=>r.json()).then(d=>{ RULES=d; setAllRules(d); }).catch(()=>{});
        fetch(`${API}/api/kpis?range=${timeRange}`).then(r=>r.json()).then(setApiKpis).catch(()=>{});
        fetch(`${API}/api/health`).then(r=>r.json()).then(d=>setOzOnline(d.openobserve)).catch(()=>{});
        fetch(`${API}/api/services?range=${timeRange}`).then(r=>r.json())
          .then(svcs=>{ SERVICES=svcs; setServices(svcs.map(s=>({...s,checked:true}))); }).catch(()=>{});
      }, [timeRange]);

      useEffect(() => {
        fetch(`${API}/api/channels`).then(r=>r.json()).then(setChannels).catch(()=>{});
      }, []);
      const [services, setServices] = useState([]);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        set('theme', theme);
      }, [theme]);
      useEffect(() => {
        const { main, sub } = ACCENTS[accent] || ACCENTS.indigo;
        document.documentElement.style.setProperty('--indigo', main);
        document.documentElement.style.setProperty('--indigo-2', sub);
        set('accent', accent);
      }, [accent]);
      useEffect(() => { localStorage.setItem('va.route', route); }, [route]);

      const toggleService = (id) => setServices(ss => ss.map(s => s.id === id ? { ...s, checked: !s.checked } : s));

      const counts = { incidents: incidents.filter(i => i.status !== 'resolved').length, rules: allRules.length, channels: channels.length };

      return (
        <div className="app">
          <Sidebar
            route={route} setRoute={setRoute}
            services={services} toggleService={toggleService}
            timeRange={timeRange} setTimeRange={setTimeRange}
            counts={counts}
          />
          <div className="main">
            <Topbar route={route} theme={theme} setTheme={setThemeState} ozOnline={ozOnline}/>
            <div className="page">
              {route === 'overview' && <Overview apiKpis={apiKpis} ozOnline={ozOnline} timeRange={timeRange}/>}
              {route === 'incidents' && <IncidentsPage incidents={incidents} onStatusChange={(id,s)=>{ fetch(`${API}/api/incidents/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})}).then(r=>r.json()).then(upd=>setIncidents(prev=>prev.map(i=>i.db_id===id?upd:i))).catch(()=>{}); }}/>}
              {route === 'rules' && <RulesPage rules={allRules} setRules={setAllRules}/>}
              {route === 'alerts' && <AlertChannelsPage channels={channels} setChannels={setChannels} theme={theme} rules={allRules}/>}
            </div>
          </div>
          <TweaksPanel tweaks={tweaks} set={set} visible={editMode}
            theme={theme} setTheme={setThemeState}
            accent={accent} setAccent={setAccentState}/>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
