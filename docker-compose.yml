services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    environment:
      ZO_ROOT_USER_EMAIL: admin@velaris.local
      ZO_ROOT_USER_PASSWORD: Admin1234!
      ZO_DATA_DIR: /data
      ZO_INGEST_ALLOWED_UPTO: 8760
    volumes:
      - openobserve_data:/data
    ports:
      - "5200:5080"
    networks:
      - log_net
    restart: unless-stopped

  dashboard:
    image: python:3.12-slim
    container_name: velaris_dashboard
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    networks:
      - log_net
    depends_on:
      - openobserve
    environment:
      OPENOBSERVE_URL: http://openobserve:5080
      OPENOBSERVE_USER: admin@velaris.local
      OPENOBSERVE_PASS: Admin1234!
      DB_PATH: /app/db/incidents.db
    command: sh -c "pip install --quiet fastapi uvicorn[standard] requests python-dotenv && uvicorn dashboard.api:app --host 0.0.0.0 --port 8501"
    restart: unless-stopped

networks:
  log_net:
    driver: bridge

volumes:
  openobserve_data:
