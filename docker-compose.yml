services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    environment:
      ZO_ROOT_USER_EMAIL: admin@velaris.local
      ZO_ROOT_USER_PASSWORD: Admin1234!
      ZO_DATA_DIR: /data
      ZO_INGEST_ALLOWED_UPTO: 8760
    volumes:
      - openobserve_data:/data
    ports:
      - "5080:5080"
    networks:
      - log_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    image: python:3.12-slim
    container_name: velaris_dashboard
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    networks:
      - log_net
    depends_on:
      openobserve:
        condition: service_healthy
    environment:
      OPENOBSERVE_URL: http://openobserve:5080
      OPENOBSERVE_USER: admin@velaris.local
      OPENOBSERVE_PASS: Admin1234!
      DB_PATH: /app/db/incidents.db
    command: >
      sh -c "pip install --quiet streamlit plotly pandas requests &&
             streamlit run dashboard/app.py
             --server.port=8501
             --server.address=0.0.0.0
             --server.headless=true"
    restart: unless-stopped

networks:
  log_net:
    driver: bridge

volumes:
  openobserve_data:
